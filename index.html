<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo SFLCAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #ffffff, #e8f5e9);
      color: #333;
    }

    header {
      background-color: #111;
      padding: 0;
      overflow: hidden;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
      animation: fadeSlide 1s ease-out;
    }

    h1, h2 {
      text-align: center;
      margin: 30px 0 10px;
    }

    h2 { color: #555; }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 10px;
    }

    .produto {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      width: 250px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .produto:hover { transform: scale(1.02); }

    .produto img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      margin: 10px 0;
      border-radius: 8px;
    }

    textarea, input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      resize: vertical;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: 'Poppins', sans-serif;
    }

    button {
      display: block;
      margin: 40px auto 20px;
      padding: 12px 30px;
      font-size: 16px;
      background: #25d366;
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      background: #1ebe5d;
      transform: scale(1.05);
    }

    .zap-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 999;
    }

    .zap-float:hover {
      background-color: #1ebe5d;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #aaa;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .produto { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <img src="img/logo.jpg" alt="Logo SFLCAR" />
  </header>

  <h1>Catálogo SFLCAR</h1>

  <h2>Insulfilme</h2>
  <div class="grid">
    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G5" /> Insulfilme G5</label>
      <img src="img/insulescuro.jpg" alt="Insulfilme G5" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G20" /> Insulfilme G20</label>
      <img src="img/insulmedio.jpg" alt="Insulfilme G20" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G35" /> Insulfilme G35</label>
      <img src="img/insulclaro.jpg" alt="Insulfilme G35" />
    </div>
  </div>

  <h2>Envelopamento</h2>
  <div class="grid">
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Preto" /> Envelopamento Preto</label>
      <img src="img/preto.jpg" alt="Envelopamento Preto" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Azul" /> Envelopamento Azul</label>
      <img src="img/azulbebe.jpg" alt="Envelopamento Azul" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Branco" /> Envelopamento Branco</label>
      <img src="img/branco.jpg" alt="Envelopamento Branco" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Vermelho" /> Envelopamento Vermelho</label>
      <img src="img/vermelho.jpg" alt="Envelopamento Vermelho" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Verde" /> Envelopamento Verde</label>
      <img src="img/verdeescuro.jpg" alt="Envelopamento Verde" />
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Vinho" /> Envelopamento Vinho</label>
      <img src="img/vinho.jpg" alt="Envelopamento Vinho" />
    </div>
    <div class="produto">
      <label><input type="checkbox" id="produtoCatalogo" /> Envelopamento Catálogo de Cores</label>
      <img src="img/catalogo.jpg" alt="Catálogo de Cores" />
      <textarea id="corCatalogo" placeholder="Digite a cor desejada aqui..."></textarea>
    </div>
  </div>

  <div style="max-width: 600px; margin: 20px auto;">
    <input type="text" id="nomeCliente" placeholder="Seu nome" />
    <input type="tel" id="numeroCliente" placeholder="Seu WhatsApp (com DDD)" />
    <textarea id="obs" rows="3" placeholder="Observações adicionais... (ex: só no vidro traseiro)"></textarea>
  </div>

  <button onclick="enviarPedido()">📲 Enviar Pedido via WhatsApp</button>

  <a href="https://wa.me/5562993117821" class="zap-float" target="_blank" title="Chamar no WhatsApp">
    🟢
  </a>

  <footer>
    SFLCAR © 2025 | Atendimento via WhatsApp: (62) 99311-7821
  </footer>

  <script>
    function enviarPedido() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
      const nome = document.getElementById('nomeCliente').value.trim();
      const numero = document.getElementById('numeroCliente').value.trim();
      const obs = document.getElementById('obs').value.trim();
      const pedidoCatalogo = document.getElementById('produtoCatalogo').checked;
      const corCatalogo = document.getElementById('corCatalogo').value.trim();

      if (checkboxes.length === 0 && !pedidoCatalogo) {
        alert('Escolhe pelo menos um produto');
        return;
      }

      if (!nome || !numero) {
        alert('Preencha seu nome e número de WhatsApp');
        return;
      }

      let pedido = `Quero fazer um Orçamento:\n\n`;
      pedido += `👤 Nome: ${nome}\n📞 WhatsApp: ${numero}\n\n`;

      checkboxes.forEach(item => {
        if (item.id !== 'produtoCatalogo') {
          pedido += `- ${item.value}\n`;
        }
      });

      if (pedidoCatalogo) {
        pedido += '- Envelopamento por Catálogo\n';
        if (corCatalogo) {
          pedido += `  Cor: ${corCatalogo}\n`;
        }
      }

      if (obs) {
        pedido += `\n📝 Obs: ${obs}`;
      }

      const telefone = '5562993117821';
      const url = `https://wa.me/${telefone}?text=${encodeURIComponent(pedido)}`;
      window.open(url, '_blank');
    }
  </script>

  <script src="https://cdn.counter.dev/script.js" data-id="3e034ea3-de45-4953-8e5a-5500d621da60" data-utcoffset="-3"></script>
</body>
</html>

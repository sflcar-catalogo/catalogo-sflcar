<!DOCTYPE html><html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo SFLCAR</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f3f3; padding: 20px; margin: 0; }
    h1 { text-align: center; color: #222; margin-bottom: 5px; }
    h2 { text-align: center; font-size: 16px; margin-top: 0; color: #666; }
    .logo { display: block; margin: 0 auto 10px; max-width: 150px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .produto { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
    .produto label { font-size: 18px; margin-bottom: 10px; }
    .produto img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
    textarea { width: 100%; height: 80px; margin-top: 20px; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; resize: none; }
    button { display: block; width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 10px; background-color: #25D366; color: white; cursor: pointer; margin-top: 20px; }
    button:hover { background-color: #1da851; }
  </style>
</head>
<body>
  <img src="img/logo.jpg" alt="Logo SFLCAR" class="logo">
  <h1>Catálogo SFLCAR</h1>
  <h2>Escolha os produtos e finalize seu pedido no WhatsApp</h2>  <div class="grid">
    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G20"> Insulfilme G20</label>
      <img src="img/g20.jpg" alt="Insulfilme G20">
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G5"> Insulfilme G5</label>
      <img src="img/g5.jpg" alt="Insulfilme G5">
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Preto Fosco"> Envelopamento Preto Fosco</label>
      <img src="img/pretof.jpeg" alt="Preto Fosco">
    </div>
    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Azul Brilhante"> Envelopamento Azul Bebe</label>
      <img src="img/azulbebe.jpeg" alt="Azul Brilhante">
    </div><!-- EXEMPLO PRA VOCÊ COPIAR E ADICIONAR MAIS PRODUTOS -->
<div class="produto">
  <label><input type="checkbox" value="Envelopamento Branco"> Envelopamento Branco</label>
  <img src="img/branco.jpg" alt="Branco">
</div>
<div class="produto">
  <label><input type="checkbox" value="Envelopamento Vermelho"> Envelopamento Vermelho</label>
  <img src="img/vermelho.jpg" alt="Vermelho">
</div>
 <div class="produto">
  <label><input type="checkbox" value="Envelopamento Vinho(Roxo)"> Envelopamento Vinho(Roxo)</label>
  <img src="img/vinho.jpg" alt="Vinho">
</div>
    <div class="produto">
  <label><input type="checkbox" value="Envelopamento Verde Escuro"> Envelopamento Verde Escuro</label>
  <img src="img/verdeescuro.jpg" alt="Verde Escuro">
</div>
    <div class="produto">
  <label><input type="checkbox" value="Envelopamento Verde Claro"> Envelopamento Verde Claro</label>
  <img src="img/verdeclaro.jpg" alt="Verde Claro">
</div>

  </div>  <textarea id="obs" placeholder="Observações do pedido (ex: aplicar apenas nos vidros traseiros, colocar brilho, etc)"></textarea><button onclick="enviarPedido()">Finalizar Pedido no WhatsApp</button>

  <script>
    function enviarPedido() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
      const obs = document.getElementById('obs').value.trim();
      if (checkboxes.length === 0) {
        alert('Escolhe pelo menos um produto');
        return;
      }
      let pedido = 'Quero fazer um pedido na SFLCAR:\n';
      checkboxes.forEach(item => pedido += `- ${item.value}\n`);
      if (obs) pedido += `\nObservações:\n${obs}`;
      const mensagem = encodeURIComponent(pedido);
      const numero = '5562993117821';
      window.open(`https://wa.me/${numero}?text=${mensagem}`, '_blank');
    }
  </script></body>
</html>

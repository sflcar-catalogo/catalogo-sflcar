<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo SFLCAR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .produto {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      width: 250px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .produto img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      margin: 10px 0;
    }

    textarea {
      width: 100%;
      padding: 5px;
      margin-top: 10px;
      resize: vertical;
    }

    button {
      display: block;
      margin: 30px auto 0;
      padding: 10px 25px;
      font-size: 16px;
      background: #2ecc71;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <h1>Catálogo SFLCAR</h1>

  <div class="grid">

    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G5"> Insulfilme G5</label>
      <img src="img/insulescuro.jpg" alt="Isulfilme G5">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G20"> Insulfilme G20</label>
      <img src="img/insulmedio.jpg" alt="Isulfilme G20">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Insulfilme G35"> Insulfilme G35</label>
      <img src="img/insulclaro.jpg" alt="Isulfilme G35">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Preto"> Envelopamento Preto</label>
      <img src="img/preto.jpg" alt="Preto">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Preto"> Envelopamento Azul</label>
      <img src="img/azulbebe.jpg" alt="Azul">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Branco"> Envelopamento Branco</label>
      <img src="img/branco.jpg" alt="Branco">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Vermelho"> Envelopamento Vermelho</label>
      <img src="img/vermelho.jpg" alt="Vermelho">
    </div>

    <div class="produto">
      <label><input type="checkbox" value="Envelopamento Verde"> Envelopamento Verde</label>
      <img src="img/verdeescuro.jpg" alt="Verde">
    </div>

    <div class="produto">
      <label><input type="checkbox" id="produtoCatalogo"> Envelopamento Catálogo de Cores</label>
      <img src="img/catalogo.jpg" alt="Catálogo de Cores">
      <textarea id="corCatalogo" placeholder="Digite a cor desejada aqui..."></textarea>
    </div>

  </div>

  <div style="max-width: 600px; margin: 20px auto;">
    <textarea id="obs" rows="3" placeholder="Observações adicionais..."></textarea>
  </div>

  <button onclick="enviarPedido()">Enviar Pedido via WhatsApp</button>

  <script>
    function enviarPedido() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
      const obs = document.getElementById('obs').value.trim();
      const pedidoCatalogo = document.getElementById('produtoCatalogo').checked;
      const corCatalogo = document.getElementById('corCatalogo').value.trim();

      if (checkboxes.length === 0 && !pedidoCatalogo) {
        alert('Escolhe pelo menos um produto');
        return;
      }

      let pedido = 'Quero fazer um pedido na SFLCAR:\n';

      checkboxes.forEach(item => {
        if (item.id !== 'produtoCatalogo') {
          pedido += `- ${item.value}\n`;
        }
      });

      if (pedidoCatalogo) {
        pedido += '- Envelopamento por Catálogo\n';
        if (corCatalogo) {
          pedido += `  Cor: ${corCatalogo}\n`;
        }
      }

      if (obs) {
        pedido += `\nObs: ${obs}`;
      }

      const telefone = '5562993117821';
      const url = `https://wa.me/${telefone}?text=${encodeURIComponent(pedido)}`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
